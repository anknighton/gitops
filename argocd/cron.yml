apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-restarter
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-restarter-role
  namespace: default
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-restarter-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: deployment-restarter
  namespace: default
roleRef:
  kind: Role
  name: deployment-restarter-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restart-media-stack-gluetun-stack
  namespace: default
spec:
  schedule: "0 0 */2 * *" # Runs at 00:00 every 2 days (every 48 hours)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: deployment-restarter
          restartPolicy: OnFailure
          containers:
          - name: kubectl-restart
            image: bitnami/kubectl:latest
            command:
            - "kubectl"
            - "rollout"
            - "restart"
            - "deployment/media-stack-gluetun-stack"
            - "-n"
            - "default"